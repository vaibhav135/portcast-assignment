services:
  postgres:
    image: postgres:17
    environment:
      # Local development only. Do not reuse these credentials in production.
      POSTGRES_USER: portcast
      POSTGRES_PASSWORD: portcast_dev
      POSTGRES_DB: portcast
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portcast -d portcast"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
